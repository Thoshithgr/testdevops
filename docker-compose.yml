services:
  metabase:
    image: metabase/metabase:v0.49.9
    container_name: metabase
    depends_on:
      mysql:
        condition: service_healthy
      postgres:
        condition: service_healthy
      mssql:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      - MB_DB_FILE=/metabase-data/metabase.db
      - JAVA_TOOL_OPTIONS=-Xms512m -Xmx1g
      - TZ=UTC
    volumes:
      - metabase-data:/metabase-data
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    container_name: mysql
    command: --default-authentication-plugin=mysql_native_password
    environment:
      - MYSQL_ROOT_PASSWORD=example
      - MYSQL_DATABASE=retail
      - MYSQL_USER=retail
      - MYSQL_PASSWORD=retailpw
      - TZ=UTC
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./scripts/mysql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-pexample"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  postgres:
    image: postgres:16
    container_name: postgres
    environment:
      - POSTGRES_PASSWORD=example
      - POSTGRES_USER=retail
      - POSTGRES_DB=retail
      - TZ=UTC
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: mssql
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=YourStrong!Passw0rd
      - MSSQL_PID=Developer
      - TZ=UTC
    ports:
      - "1433:1433"
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "bash -lc 'echo > /dev/tcp/127.0.0.1/1433' "]
      interval: 5s
      timeout: 3s
      retries: 60
    restart: unless-stopped

  mssql-seed:
    image: mcr.microsoft.com/mssql-tools
    container_name: mssql-seed
    depends_on:
      mssql:
        condition: service_healthy
    environment:
      - SA_PASSWORD=YourStrong!Passw0rd
    volumes:
      - ./scripts/mssql:/scripts/mssql:ro
    entrypoint: ["/bin/sh", "-c"]
    command: >
      i=0; until /opt/mssql-tools/bin/sqlcmd -S mssql -U SA -P "$$SA_PASSWORD" -Q "SELECT 1" >/dev/null 2>&1 || [ $$i -ge 60 ]; do i=$$((i+1)); echo "Waiting for MSSQL... $$i"; sleep 2; done; \
      for f in /scripts/mssql/*.sql; do echo "Running $$f"; /opt/mssql-tools/bin/sqlcmd -S mssql -U SA -P "$$SA_PASSWORD" -i "$$f"; done; echo "MSSQL seed done." 
    restart: "no"

volumes:
  metabase-data:
  mysql-data:
  postgres-data:
  mssql-data:
